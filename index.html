<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="description" content="Paraíso Sweets, doceria em Surubim - PE com delivery. Bolos, docinhos, salgados, morangos do amor e cheesecakes. Faça já sua encomenda pelo WhatsApp.">
  <meta name="theme-color" content="#f9b2c6">
  <meta property="og:title" content="Paraíso Sweets | Doceria em Surubim - PE">
  <meta property="og:description" content="Doce é sempre uma boa ideia! Faça já sua encomenda.">

<body>

  <!-- ====================================================================
       LINKS CONFIGURADOS:
       WhatsApp  -> https://wa.me/5581981811992  ((81) 98181-1992)
       Instagram -> https://www.instagram.com/paraiso_sweets/
       Mapa      -> busca "Paraíso Sweets Doceria Surubim PE" no Google Maps

       ==================================================================== -->

  <main class="page">
    <img
      class="flyer"
      src="assets/img/flyer.jpg"
      width="941" height="1671"
      alt="Flyer do Paraíso Sweets, doceria em Surubim - PE. Fachada da loja com a placa Paraíso Sweets e um casal sorrindo na entrada. Logo: Paraíso Sweets Doceria, com um batedor de claras e um coração. Frase: Doce é sempre uma boa ideia! Seja bem-vindo(a)! Somos o Paraíso Sweets, uma doceria feita com amor para adoçar ainda mais os seus momentos! Botões: Nossos Doces, Encomendas, Avaliações e Nossa Localização. Fotos de produtos: Bolos, Docinhos, Salgados, Morangos, Cheesecakes e muito mais. Botão: Faça já sua encomenda! (81) 98181-1992, WhatsApp. Surubim - PE | Delivery. Instagram @paraiso_sweets. Adoçando sua vida com muito carinho!">

    <!-- Logo -> Instagram -->
    <a class="hit hit--round hit--logo"
       href="https://www.instagram.com/paraiso_sweets/"
       target="_blank" rel="noopener"
       aria-label="Abrir o Instagram do Paraíso Sweets"></a>
    <!-- Botão "Nossos Doces" -> Instagram -->
    <a class="hit hit--card hit--doces"
       href="https://www.instagram.com/paraiso_sweets/"
       target="_blank" rel="noopener"
       aria-label="Ver nossos doces no Instagram"></a>
    <!-- Botão "Encomendas" -> WhatsApp -->
    <a class="hit hit--card hit--enc"
       href="https://wa.me/5581981811992?text=Ol%C3%A1%21%20Vim%20pelo%20seu%20Instagram%20e%20gostaria%20de%20fazer%20um%20pedido."
       target="_blank" rel="noopener"
       aria-label="Fazer encomenda pelo WhatsApp"></a>
    <!-- Botão "Avaliações" -> TROQUE o link (não aparece no flyer) -->
    <a class="hit hit--card hit--aval"
       href="https://SEU-LINK-AVALIACOES-AQUI"
       target="_blank" rel="noopener"
       aria-label="Ver avaliações dos clientes"></a>
    <!-- Botão "Nossa Localização" -> Google Maps -->
    <a class="hit hit--card hit--loc"
       href="https://www.google.com/maps/search/?api=1&amp;query=Para%C3%ADso+Sweets+Doceria+Surubim+PE"
       target="_blank" rel="noopener"
       aria-label="Ver nossa localização no mapa"></a>
    <!-- Botão grande "Faça já sua encomenda!" -> WhatsApp -->
    <a class="hit hit--pill hit--wa"
       href="https://wa.me/5581981811992?text=Ol%C3%A1%21%20Vim%20pelo%20seu%20Instagram%20e%20gostaria%20de%20fazer%20um%20pedido."
       target="_blank" rel="noopener"
       aria-label="Fazer encomenda pelo WhatsApp (81) 98181-1992"></a>
    <!-- "Surubim - PE | Delivery" -> Google Maps -->
    <a class="hit hit--pill hit--delivery"
       href="https://www.google.com/maps/search/?api=1&amp;query=Para%C3%ADso+Sweets+Doceria+Surubim+PE"
       target="_blank" rel="noopener"
       aria-label="Surubim - PE, delivery: ver localização no mapa"></a>
    <!-- "@paraiso_sweets" -> Instagram -->
    <a class="hit hit--pill hit--ig"
       href="https://www.instagram.com/paraiso_sweets/"
       target="_blank" rel="noopener"
       aria-label="Instagram @paraiso_sweets"></a>
  </main>

</body>
</html>
